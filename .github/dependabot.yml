version: 2
# Atualizações mensais e agrupadas: minors/patches chegam juntos em 1 PR por ecossistema.
# Majors continuam em PRs separados, porque podem exigir ajuste de código.
updates:
- package-ecosystem: composer
  directory: "/"
  target-branch: natalcode
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  versioning-strategy: increase
  groups:
    composer-minor-patch:
      update-types:
        - minor
        - patch

- package-ecosystem: npm
  directory: "/"
  target-branch: natalcode
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  versioning-strategy: increase
  groups:
    npm-minor-patch:
      update-types:
        - minor
        - patch

- package-ecosystem: github-actions
  directory: "/"
  target-branch: natalcode
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    actions-all:
      patterns:
        - "*"
